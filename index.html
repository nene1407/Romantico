
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para alguien muy especial ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #020008;
    color: white;
    overflow: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#stars { z-index: 0; }
#heart { z-index: 1; }

.overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
}

.content {
    width: min(100%, 650px);
    padding: 20px;
    animation: appear 2s ease both;
}

.small {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .8;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(40px, 9vw, 76px);
    margin-bottom: 25px;
    background: linear-gradient(90deg, white, #ff8ec7, white);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px #ff4f9a);
}

.message {
    font-size: clamp(16px, 3.5vw, 21px);
    line-height: 1.8;
    color: #f7eaf2;
}

.highlight {
    color: #ff8fc7;
    font-weight: bold;
}

button {
    margin-top: 30px;
    padding: 15px 30px;
    border-radius: 50px;
    border: 1px solid #ff9bc9;
    color: white;
    background: linear-gradient(135deg, #ff4f9a, #9b36c9);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #ff4f9a66;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px #ff4f9a;
}

#finalMessage {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    background: radial-gradient(circle, #32102d, #050008 75%);
    opacity: 0;
    visibility: hidden;
    transform: scale(.7);
    transition: .6s;
}

#finalMessage.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

.finalBox {
    width: min(100%, 600px);
}

.finalBox .emoji {
    font-size: clamp(65px, 15vw, 110px);
    animation: shake .5s infinite;
}

.finalBox h2 {
    margin: 20px 0;
    font-size: clamp(45px, 11vw, 85px);
    color: #ff70b5;
    text-shadow: 0 0 25px #ff1689;
}

.finalBox p {
    font-size: clamp(17px, 4vw, 23px);
    line-height: 1.7;
}

.petal {
    position: fixed;
    top: -40px;
    z-index: 10;
    pointer-events: none;
    animation: fall linear forwards;
}

#finalMessage button {
    background: #ffffff18;
    border-color: #ffffff66;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fall {
    to {
        transform: translateY(110vh) translateX(80px) rotate(720deg);
        opacity: 0;
    }
}

@keyframes shake {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.12); }
}

@media(max-height: 650px) {
    .content { padding: 10px; }
    h1 { margin-bottom: 15px; }
    .message { line-height: 1.5; }
    button { margin-top: 18px; }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="heart"></canvas>

<div class="overlay">
    <main class="content">

        <div class="small">Tengo algo que decirte... ✨</div>

        <h1>Para ti ❤️</h1>

        <p class="message">
         

          
          

            <span class="highlight">
                Por eso preparé algo solo para ti...
            </span>
        </p>

        <button onclick="showFinal()">Ver más 💗</button>
    </main>
</div>

<div id="finalMessage">
    <div class="finalBox">
        <div class="emoji">🤡💗</div>

        <h2>¡HOLA, FEA! 😂</h2>

        <p>
        </p>

        <button onclick="closeFinal()">Volver a caer 🤡</button>
    </div>
</div>

<script>
const starsCanvas = document.getElementById("stars");
const starsCtx = starsCanvas.getContext("2d");

const heartCanvas = document.getElementById("heart");
const ctx = heartCanvas.getContext("2d");

let W, H;
let stars = [];
let particles = [];

const mouse = { x: -1000, y: -1000, active: false };

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    [starsCanvas, heartCanvas].forEach(canvas => {
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        canvas.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    });

    createStars();
    createHeart();
}

function createStars() {
    stars = Array.from({ length: 220 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + .3,
        alpha: Math.random(),
        speed: Math.random() * .015 + .003
    }));
}

function drawStars() {
    starsCtx.clearRect(0, 0, W, H);

    stars.forEach(s => {
        s.alpha += s.speed;

        if (s.alpha >= 1 || s.alpha <= .1) s.speed *= -1;

        starsCtx.beginPath();
        starsCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starsCtx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        starsCtx.fill();
    });

    requestAnimationFrame(drawStars);
}

function heartFunction(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t) - Math.cos(4*t))
    };
}

function createHeart() {
    particles = [];

    const scale = Math.min(W, H) / 39;

    for (let i = 0; i < 1100; i++) {
        const t = Math.random() * Math.PI * 2;
        const h = heartFunction(t);
        const radius = Math.sqrt(Math.random());

        particles.push({
            x: W / 2 + h.x * scale * radius,
            y: H / 2 + h.y * scale * radius,
            size: Math.random() * 1.8 + .4,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * .025 + .008
        });
    }
}

function animateHeart() {
    ctx.clearRect(0, 0, W, H);

    particles.forEach(p => {
        p.phase += p.speed;

        let x = p.x + Math.sin(p.phase) * 2;
        let y = p.y + Math.cos(p.phase) * 2;

        if (mouse.active) {
            const dx = x - mouse.x;
            const dy = y - mouse.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 100 && distance > 0) {
                const force = (100 - distance) / 100;
                x += dx / distance * force * 25;
                y += dy / distance * force * 25;
            }
        }

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,${100 + Math.random()*100},190,.9)`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff4f9a";
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animateHeart);
}

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
});

window.addEventListener("touchmove", e => {
    if (!e.touches.length) return;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
}, { passive: true });

function createPetal() {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.textContent = Math.random() > .5 ? "🌸" : "❤️";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.fontSize = 12 + Math.random() * 18 + "px";
    petal.style.animationDuration = 5 + Math.random() * 5 + "s";

    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 11000);
}

let petalTimer;

function showFinal() {
    document.getElementById("finalMessage").classList.add("active");

    for (let i = 0; i < 35; i++) {
        setTimeout(createPetal, i * 60);
    }

    clearInterval(petalTimer);
    petalTimer = setInterval(createPetal, 250);
}

function closeFinal() {
    document.getElementById("finalMessage").classList.remove("active");
    clearInterval(petalTimer);
    petalTimer = null;
}

resize();
drawStars();
animateHeart();

window.addEventListener("resize", resize);
</script>

</body>
</html>
